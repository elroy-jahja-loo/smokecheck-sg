      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f9f9ff; color: #191c21; }

  <body>
    <main>
      <div class="card">
        <h1>SmokeCheck SG is offline</h1>
        <p>The live map, OneMap search, and source-backed status checks need a network connection.</p>

        <p><a href="/rules">Try cached rules</a> or reconnect and return to the map.</p>
      </div>
    </main>
