version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-toolchain:
        patterns:
          - next
          - eslint-config-next
      react-toolchain:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
